<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A1F18">
<title>دارفلو | نظام يرد على زبناء وكالتك العقارية فوراً</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='6' fill='%230A1F18'/%3E%3Cpath d='M5 14 14 6l9 8M8.5 12.5V22h11v-9.5' fill='none' stroke='%23C8A24A' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --g9:#0A1F18;   /* base */
  --g8:#0F2B21;   /* section */
  --g7:#16382C;   /* panel / selected */
  --g6:#1F4A3A;   /* hover */
  --ivory:#F3EEE0;
  --ivory-2:#BCC8BE;
  --gold:#C8A24A;
  --gold-2:#E6CD8A;
  --ink:#0A1F18;
  --paper-line:#D5C9A6;
  --err:#9B2C2C;
  --font-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
html[lang="fr"]{
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--g9);color:var(--ivory);
  font-family:var(--font-body);font-size:1.0625rem;line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
html[lang="fr"] body{line-height:1.6}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;line-height:1.5}
html[lang="fr"] h1,html[lang="fr"] h2,html[lang="fr"] h3{font-weight:500;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
.wrap{width:min(1120px,calc(100% - 2.5rem));margin-inline:auto}
:focus-visible{outline:3px solid var(--gold-2);outline-offset:3px}
.skip{position:absolute;inset-inline-start:1rem;top:-4rem;background:var(--gold);color:var(--ink);padding:.5rem 1rem;border-radius:6px;z-index:10}
.skip:focus{top:1rem}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:1.1rem}
.brand{display:inline-flex;align-items:center;gap:.6rem;text-decoration:none;font-family:var(--font-display);font-size:1.35rem;font-weight:600}
.brand svg{display:block}
.lang{
  font:inherit;font-size:.95rem;color:var(--ivory);background:transparent;cursor:pointer;
  border:1px solid rgba(200,162,74,.55);border-radius:999px;padding:.4rem 1.05rem;min-height:44px;
}
.lang:hover{background:var(--g7)}

/* hero */
.hero{text-align:center;padding-block:2rem 1.75rem}
.hero h1{
  font-size:clamp(1.65rem,1.1rem + 2.8vw,2.9rem);
  max-width:22em;margin-inline:auto;color:var(--ivory);
  animation:rise .7s ease both;
}
.hero .lead{
  max-width:44rem;margin:1.25rem auto 0;color:var(--ivory-2);
  font-size:clamp(1rem,.95rem + .25vw,1.15rem);animation:rise .7s .12s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* video */
.video{padding-block:1.25rem 3rem;scroll-margin-top:1rem}
.vhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.75rem 1rem;text-align:center}
.vhead h2{font-size:clamp(1.15rem,1rem + .8vw,1.55rem)}
.badge{
  display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--gold);color:var(--gold-2);
  border-radius:999px;padding:.1rem .8rem;font-size:.9rem;white-space:nowrap
}
.frame{
  position:relative;aspect-ratio:16/9;max-width:960px;margin:1.6rem auto 0;
  background:var(--g8);border:1px solid var(--gold);border-radius:4px;overflow:hidden;
  outline:1px solid rgba(200,162,74,.3);outline-offset:8px;
}
.frame video,.frame .poster{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.frame .poster{transition:opacity .4s}
.frame[data-real="true"][data-started="true"] .poster{opacity:0}
.surface{
  position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;padding:0;cursor:pointer;
  display:grid;place-items:center;color:var(--ink);
}
.big-play{
  width:clamp(64px,11vw,92px);aspect-ratio:1;border-radius:50%;background:var(--gold);
  display:grid;place-items:center;transition:opacity .25s,transform .25s;
}
.big-play svg{width:38%;height:38%}
.surface:hover .big-play{transform:scale(1.06)}
.frame[data-state="playing"] .big-play{opacity:0}
.demo-tag{
  position:absolute;inset-block-end:.75rem;inset-inline-start:.75rem;font-size:.8rem;line-height:1.5;
  padding:.15rem .7rem;border:1px solid rgba(200,162,74,.6);border-radius:999px;color:var(--gold-2);background:rgba(10,31,24,.75);
}
.controls{display:flex;align-items:center;gap:1rem;max-width:960px;margin:1.4rem auto 0}
.cbtn{
  flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold-2);
  display:grid;place-items:center;cursor:pointer;padding:0
}
.cbtn:hover{background:var(--g7)}
.segs{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg{height:8px;border-radius:2px;background:rgba(243,238,224,.16);position:relative;overflow:hidden}
.seg i{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:var(--gold)}
.time{flex:none;min-width:3.4rem;text-align:end;font-variant-numeric:tabular-nums;direction:ltr;color:var(--ivory-2);font-size:.95rem}
.hint{max-width:960px;margin:1rem auto 0;color:var(--ivory-2);font-size:.95rem;text-align:center;line-height:1.7}
.demo-row{margin-top:.75rem;text-align:center;font-size:.9rem;color:var(--ivory-2)}
.demo-row button{font:inherit;color:var(--gold-2);background:none;border:0;text-decoration:underline;cursor:pointer;padding:.5rem;min-height:44px}

/* gate: locked panel + form */
.gate{padding-block:.5rem 4.5rem;scroll-margin-top:1rem}
.locked{
  max-width:820px;margin-inline:auto;text-align:center;padding:2rem 1.5rem;
  border:1px dashed rgba(200,162,74,.55);border-radius:6px;color:var(--ivory-2)
}
.locked svg{color:var(--gold);margin-bottom:.5rem}
.locked h2{font-size:1.25rem;color:var(--ivory);margin-bottom:.35rem}

.paper{
  max-width:820px;margin-inline:auto;background:var(--ivory);color:var(--ink);border-radius:6px;
  padding:clamp(1.25rem,4vw,2.75rem);
  box-shadow:0 0 0 1px var(--gold),0 0 0 8px var(--g9),0 0 0 9px rgba(200,162,74,.3);
}
.paper.is-open{animation:rise .55s ease both}
.paper h2{font-size:clamp(1.4rem,1.1rem + 1.2vw,2rem);outline:none}
.paper .sub{margin-top:.5rem;color:#3C4B43;font-size:1rem}
form{margin-top:1.75rem}
.grid{display:grid;gap:1.1rem 1.25rem}
@media(min-width:720px){.grid.two{grid-template-columns:1fr 1fr}}
.field{min-width:0}
label,legend{display:block;font-weight:600;font-size:.97rem;margin-bottom:.4rem;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.group{margin-top:1.4rem}
input[type=text],input[type=tel]{
  width:100%;min-height:50px;padding:.6rem .9rem;border:1px solid var(--paper-line);border-radius:6px;
  background:#FFFCF4;font:inherit;font-size:1rem;color:var(--ink);unicode-bidi:plaintext
}
input[type=text]:focus,input[type=tel]:focus{border-color:var(--g6);outline:3px solid rgba(200,162,74,.6);outline-offset:1px}
input[aria-invalid="true"]{border-color:var(--err)}
.err{color:var(--err);font-size:.9rem;margin-top:.35rem;line-height:1.5}
.err:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative;display:inline-block;margin:0;font-weight:500}
.chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chip span{
  display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.35rem 1.05rem;
  border:1px solid var(--paper-line);border-radius:999px;background:#FFFCF4;font-size:.95rem;line-height:1.4;
  transition:background .15s,color .15s,border-color .15s
}
.chip:hover span{border-color:var(--g6)}
.chip input:checked + span{background:var(--g7);border-color:var(--g7);color:var(--ivory)}
.chip input:checked + span::before{content:"\2713";margin-inline-end:.45rem;color:var(--gold-2)}
.chip input:focus-visible + span{outline:3px solid rgba(200,162,74,.8);outline-offset:2px}
.chip.day span{flex-direction:column;border-radius:12px;min-width:68px;padding:.5rem .6rem;gap:0}
.chip.day span::before{display:none}
.chip.day small{font-size:.8rem;opacity:.85;line-height:1.5}
.chip.day b{font-size:1.25rem;line-height:1.3;font-weight:600}
.chip.day input:checked + span small{opacity:1}
.sep{margin-top:1.8rem;padding-top:1.4rem;border-top:1px dashed var(--paper-line)}
.sep h3{font-size:1.15rem;margin-bottom:1rem}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;opacity:0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:.8rem 2.2rem;border-radius:999px;
  border:0;font:600 1.05rem var(--font-body);cursor:pointer;text-decoration:none;transition:background .15s
}
.btn--dark{background:var(--g7);color:var(--ivory);width:100%}
.btn--dark:hover{background:var(--g6)}
.btn--dark:disabled{opacity:.65;cursor:progress}
.btn--gold{background:var(--gold);color:var(--ink)}
.btn--gold:hover{background:var(--gold-2)}
@media(min-width:720px){.btn--dark{width:auto;min-width:300px}}
.form-msg{margin-top:1rem;font-weight:500}
.privacy{margin-top:1rem;font-size:.88rem;color:#4A5951;line-height:1.6}
.done{text-align:center;padding-block:1rem}
.done svg{color:var(--g7)}
.done h2{margin-top:.5rem}
.done p{margin-top:.6rem;color:#3C4B43;max-width:34rem;margin-inline:auto}

/* value */
.value{background:var(--g8);padding-block:4.5rem}
.value h2,.how h2{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.4rem)}
.value .lead,.how .lead{margin-top:.75rem;color:var(--ivory-2);max-width:38rem}
.vlist{display:grid;gap:0 3.5rem;margin-top:2.5rem}
@media(min-width:720px){.vlist{grid-template-columns:1fr 1fr}}
.vitem{border-top:1px solid rgba(200,162,74,.4);padding-block:1.3rem 1.9rem}
.vitem h3{font-size:1.2rem;color:var(--gold-2)}
.vitem p{margin-top:.4rem;color:var(--ivory-2)}

/* how */
.how{padding-block:4.5rem}
.steps{list-style:none;margin:2.5rem 0 0;padding:0;display:grid;gap:2rem}
.step{position:relative;display:grid;grid-template-columns:auto 1fr;gap:0 1.1rem}
.step .n{
  width:3.1rem;height:3.1rem;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;
  font-family:var(--font-display);font-size:1.25rem;color:var(--gold-2);grid-row:span 2
}
.step h3{font-size:1.2rem;align-self:center}
.step p{color:var(--ivory-2);grid-column:2}
@media(min-width:860px){
  .steps{grid-template-columns:repeat(3,1fr);gap:2.5rem}
  .step{display:block}
  .step .n{margin-bottom:1.1rem}
  .step:not(:last-child)::after{
    content:"";position:absolute;top:1.55rem;inset-inline-start:4rem;inset-inline-end:-1.5rem;border-top:1px dashed rgba(200,162,74,.5)
  }
  .step h3{margin-bottom:.4rem}
}

/* final + footer */
.final{padding-block:1rem 4.5rem}
.final .box{border:1px solid rgba(200,162,74,.45);border-radius:6px;padding:clamp(2rem,5vw,3.5rem) 1.5rem;text-align:center}
.final h2{font-size:clamp(1.5rem,1.1rem + 1.6vw,2.2rem)}
.final p{margin:.6rem 0 1.6rem;color:var(--ivory-2)}
footer{border-top:1px solid rgba(200,162,74,.25);padding-block:1.5rem 2rem;color:var(--ivory-2);font-size:.9rem;text-align:center}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>

<body>
<a class="skip" href="#main" data-i18n="skip"></a>

<header class="wrap top">
  <a class="brand" href="#" aria-label="DarFlow">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M3.5 14 14 4.5 24.5 14M7.5 12.5V23h13V12.5" fill="none" stroke="#C8A24A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span data-i18n="brand"></span>
  </a>
  <button class="lang" id="langBtn" type="button" data-i18n-aria="lang.aria"></button>
</header>

<main id="main">

  <section class="hero wrap">
    <h1 data-i18n="hero.title"></h1>
    <p class="lead" data-i18n="hero.lead"></p>
  </section>

  <section class="video wrap" id="video" aria-labelledby="videoTitle">
    <div class="vhead">
      <h2 id="videoTitle" data-i18n="video.title"></h2>
      <span class="badge" data-i18n="video.badge"></span>
    </div>

    <div class="frame" id="stage" data-state="idle">
      <svg class="poster" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <pattern id="win" width="40" height="52" patternUnits="userSpaceOnUse">
            <rect x="9" y="10" width="22" height="32" fill="none" stroke="#C8A24A" stroke-opacity=".5" stroke-width="2"/>
          </pattern>
        </defs>
        <rect width="1600" height="900" fill="#0F2B21"/>
        <g stroke="#C8A24A" stroke-opacity=".35" stroke-width="1.5">
          <line x1="200" y1="140" x2="1400" y2="140"/>
          <line x1="200" y1="128" x2="200" y2="152"/><line x1="440" y1="128" x2="440" y2="152"/>
          <line x1="680" y1="128" x2="680" y2="152"/><line x1="920" y1="128" x2="920" y2="152"/>
          <line x1="1160" y1="128" x2="1160" y2="152"/><line x1="1400" y1="128" x2="1400" y2="152"/>
        </g>
        <g stroke="#C8A24A" stroke-width="2.5" fill="#143A2D">
          <rect x="200" y="520" width="200" height="260"/>
          <rect x="440" y="312" width="200" height="468"/>
          <rect x="680" y="208" width="200" height="572"/>
          <rect x="920" y="416" width="240" height="364"/>
          <rect x="1200" y="520" width="200" height="260"/>
        </g>
        <g fill="url(#win)">
          <rect x="200" y="520" width="200" height="260"/>
          <rect x="440" y="312" width="200" height="468"/>
          <rect x="680" y="208" width="200" height="572"/>
          <rect x="920" y="416" width="240" height="364"/>
          <rect x="1200" y="520" width="200" height="260"/>
        </g>
        <line x1="100" y1="780" x2="1500" y2="780" stroke="#C8A24A" stroke-width="3"/>
        <line x1="100" y1="800" x2="1500" y2="800" stroke="#C8A24A" stroke-opacity=".3" stroke-width="1.5"/>
      </svg>

      <button class="surface" id="surface" type="button" tabindex="-1" aria-hidden="true">
        <span class="big-play" id="bigPlay"></span>
      </button>
      <span class="demo-tag" id="demoTag" hidden data-i18n="video.demo"></span>
    </div>

    <div class="controls">
      <button class="cbtn" id="playBtn" type="button"></button>
      <div class="segs" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="video.progress">
        <span class="seg"><i></i></span><span class="seg"><i></i></span><span class="seg"><i></i></span><span class="seg"><i></i></span><span class="seg"><i></i></span>
      </div>
      <span class="time" id="timeLeft">5:00</span>
      <button class="cbtn" id="muteBtn" type="button" hidden></button>
    </div>

    <p class="hint" data-i18n="video.hint"></p>
    <p class="demo-row" id="demoRow" hidden>
      <span data-i18n="video.demoNote"></span>
      <button type="button" id="skipBtn" data-i18n="video.skip"></button>
    </p>
    <p class="sr-only" id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></p>
  </section>

  <section class="gate wrap" id="gate" aria-labelledby="lockedTitle">
    <div class="locked" id="locked">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <h2 id="lockedTitle" data-i18n="locked.title"></h2>
      <p data-i18n="locked.text"></p>
    </div>

    <div class="paper" id="formPanel" hidden>
      <div id="formWrap">
        <h2 id="formTitle" tabindex="-1" data-i18n="form.title"></h2>
        <p class="sub" data-i18n="form.lead"></p>

        <form id="leadForm" novalidate>
          <div class="grid two">
            <div class="field">
              <label for="name" data-i18n="f.name"></label>
              <input type="text" id="name" name="name" autocomplete="name" aria-describedby="err-name">
              <p class="err" id="err-name"></p>
            </div>
            <div class="field">
              <label for="phone" data-i18n="f.phone"></label>
              <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="0612345678" aria-describedby="err-phone">
              <p class="err" id="err-phone"></p>
            </div>
            <div class="field">
              <label for="agency" data-i18n="f.agency"></label>
              <input type="text" id="agency" name="agency" autocomplete="organization" aria-describedby="err-agency">
              <p class="err" id="err-agency"></p>
            </div>
            <div class="field">
              <label for="city" data-i18n="f.city"></label>
              <input type="text" id="city" name="city" autocomplete="address-level2">
            </div>
          </div>

          <fieldset class="group">
            <legend data-i18n="f.team"></legend>
            <div class="chips">
              <label class="chip"><input type="radio" name="team" value="1-3"><span data-i18n="o.team.1"></span></label>
              <label class="chip"><input type="radio" name="team" value="4-10"><span data-i18n="o.team.2"></span></label>
              <label class="chip"><input type="radio" name="team" value="10+"><span data-i18n="o.team.3"></span></label>
            </div>
            <p class="err" id="err-team"></p>
          </fieldset>

          <fieldset class="group">
            <legend data-i18n="f.leads"></legend>
            <div class="chips">
              <label class="chip"><input type="radio" name="leads" value="<50"><span data-i18n="o.leads.1"></span></label>
              <label class="chip"><input type="radio" name="leads" value="50-200"><span data-i18n="o.leads.2"></span></label>
              <label class="chip"><input type="radio" name="leads" value="200+"><span data-i18n="o.leads.3"></span></label>
            </div>
            <p class="err" id="err-leads"></p>
          </fieldset>

          <fieldset class="group">
            <legend data-i18n="f.pains"></legend>
            <div class="chips">
              <label class="chip"><input type="checkbox" name="pains" value="slow_reply"><span data-i18n="o.pain.1"></span></label>
              <label class="chip"><input type="checkbox" name="pains" value="lost_leads"><span data-i18n="o.pain.2"></span></label>
              <label class="chip"><input type="checkbox" name="pains" value="scattered_data"><span data-i18n="o.pain.3"></span></label>
              <label class="chip"><input type="checkbox" name="pains" value="visit_scheduling"><span data-i18n="o.pain.4"></span></label>
              <label class="chip"><input type="checkbox" name="pains" value="no_reports"><span data-i18n="o.pain.5"></span></label>
            </div>
          </fieldset>

          <div class="sep">
            <h3 data-i18n="form.when"></h3>
            <fieldset>
              <legend data-i18n="f.date"></legend>
              <div class="chips" id="dates"></div>
              <p class="err" id="err-date"></p>
            </fieldset>
            <fieldset class="group">
              <legend data-i18n="f.time"></legend>
              <div class="chips" id="times">
                <label class="chip"><input type="radio" name="time" value="10:00"><span>10:00</span></label>
                <label class="chip"><input type="radio" name="time" value="11:30"><span>11:30</span></label>
                <label class="chip"><input type="radio" name="time" value="14:00"><span>14:00</span></label>
                <label class="chip"><input type="radio" name="time" value="15:30"><span>15:30</span></label>
                <label class="chip"><input type="radio" name="time" value="17:00"><span>17:00</span></label>
              </div>
              <p class="err" id="err-time"></p>

/* ===== أدوات ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lang = 'ar';
let booked = null;

const t = (k, vars) => {
  let s = (I18N[lang] && I18N[lang][k]) ?? I18N.ar[k] ?? k;
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.replace(`{${a}}`, b);
  return s;
};
const locale = () => lang === 'ar' ? 'ar-MA-u-nu-latn' : 'fr-FR';

const ICONS = {

/* ===== اللغة ===== */
function setLang(l) {
  lang = l;
  const h = document.documentElement;
  h.lang = l; h.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.title = t('doc.title');
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $$('.err[data-key]').forEach(el => { if (el.dataset.key) el.textContent = t(el.dataset.key); });
  $('#langBtn').textContent = t('lang.other');
  $('#langBtn').setAttribute('lang', l === 'ar' ? 'fr' : 'ar');
  buildDates();
  updateButtons();
  if (booked) renderDone();
  if (formBusy) $('#submitBtn').textContent = t('form.sending');
}
$('#langBtn').addEventListener('click', () => setLang(lang === 'ar' ? 'fr' : 'ar'));

/* ===== مشغل الفيديو (بلا تقديم) ===== */
const stage = $('#stage'), playBtn = $('#playBtn'), muteBtn = $('#muteBtn');
const segs = $$('.seg i'), timeEl = $('#timeLeft'), progress = $('#progress');
const st = { t: 0, dur: CONFIG.DEMO_DURATION, max: 0, playing: false, done: false };
let video = null, timer = null, unlocked = false;

if (CONFIG.VIDEO_SRC) {
  video = document.createElement('video');
  video.src = CONFIG.VIDEO_SRC;
  if (CONFIG.POSTER) video.poster = CONFIG.POSTER;
  video.playsInline = true;
  video.preload = 'metadata';
  video.disablePictureInPicture = true;
  video.setAttribute('controlsList', 'nodownload noremoteplayback noplaybackrate');
  video.tabIndex = -1;
  stage.insertBefore(video, $('#surface'));
  stage.dataset.real = 'true';
  muteBtn.hidden = false;
  video.addEventListener('loadedmetadata', () => { if (video.duration) st.dur = video.duration; render(); });
  video.addEventListener('timeupdate', () => {
    if (!video.seeking && video.currentTime - st.max < 2) st.max = Math.max(st.max, video.currentTime);
    st.t = video.currentTime; render();
  });
  video.addEventListener('seeking', () => { if (video.currentTime > st.max + 1) video.currentTime = st.max; });
  video.addEventListener('play', () => setPlaying(true));
  video.addEventListener('pause', () => { if (!video.ended) setPlaying(false); });
  video.addEventListener('ended', finish);
  muteBtn.addEventListener('click', () => { video.muted = !video.muted; updateButtons(); });
} else {
  $('#demoTag').hidden = false;
  $('#demoRow').hidden = false;
  $('#skipBtn').addEventListener('click', () => { st.t = st.dur; render(); finish(); });
}

function setPlaying(v) {
  st.playing = v;
  if (v) stage.dataset.started = 'true';
  stage.dataset.state = v ? 'playing' : (stage.dataset.started ? 'paused' : 'idle');
  updateButtons();
}
function updateButtons() {
  const key = st.done ? 'replay' : st.playing ? 'pause' : 'play';
  playBtn.innerHTML = ICONS[key];
  playBtn.setAttribute('aria-label', t('video.' + key));
  $('#bigPlay').innerHTML = ICONS.play;
  if (video) {
    muteBtn.innerHTML = video.muted ? ICONS.mute : ICONS.vol;
    muteBtn.setAttribute('aria-label', t(video.muted ? 'video.unmute' : 'video.mute'));
  }
}
function render() {
  const per = st.dur / 5;
  segs.forEach((el, i) => {
    const f = Math.min(Math.max((st.t - i * per) / per, 0), 1);
    el.style.width = (f * 100) + '%';
  });
  const left = Math.max(0, Math.ceil(st.dur - st.t));
  timeEl.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  progress.setAttribute('aria-valuenow', Math.round((st.t / st.dur) * 100) || 0);
}
function start() {
  if (video) { video.play().catch(() => setPlaying(false)); }
  else { setPlaying(true); clearInterval(timer); timer = setInterval(tick, 250); }
}
function pausePlayback() {
  if (video) video.pause();
  else { clearInterval(timer); setPlaying(false); }
}
function tick() {
  st.t = Math.min(st.dur, st.t + 0.25);
  st.max = Math.max(st.max, st.t);
  render();
  if (st.t >= st.dur) finish();
}
function finish() {
  clearInterval(timer);
  st.done = true; st.t = st.dur; render();
  setPlaying(false);
  unlock();
}
function replay() {
  st.done = false; st.t = 0; st.max = 0; render();
  if (video) video.currentTime = 0;
  start();
}
function toggle() {
  if (st.done) replay();
  else if (st.playing) pausePlayback();
  else start();
}
playBtn.addEventListener('click', toggle);
$('#surface').addEventListener('click', toggle);
document.addEventListener('contextmenu', e => { if (e.target.closest('#stage')) e.preventDefault(); });

function unlock() {
  if (unlocked) return;
  unlocked = true;
  $('#locked').hidden = true;
  const panel = $('#formPanel');
  panel.hidden = false;
  panel.classList.add('is-open');
  $('#live').textContent = t('video.unlocked');
  panel.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  $('#formTitle').focus({ preventScroll: true });
}

/* ===== أيام الحجز ===== */
function buildDates() {
  const wrap = $('#dates');
  const prev = $('input:checked', wrap)?.value;
  wrap.innerHTML = '';
  const fw = new Intl.DateTimeFormat(locale(), { weekday: 'short' });
  const fd = new Intl.DateTimeFormat(locale(), { day: 'numeric' });
  const fm = new Intl.DateTimeFormat(locale(), { month: 'short' });
  const d = new Date(); d.setHours(12, 0, 0, 0);
  let n = 0;
  while (n < 6) {
    d.setDate(d.getDate() + 1);
    const wd = d.getDay();
    if (wd === 0 || wd === 6) continue;
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const label = document.createElement('label');
    label.className = 'chip day';
    label.innerHTML = '<input type="radio" name="date" value="' + iso + '"><span><small>' + fw.format(d) + '</small><b>' + fd.format(d) + '</b><small>' + fm.format(d) + '</small></span>';
    if (iso === prev) $('input', label).checked = true;
    wrap.appendChild(label);
    n++;
  }
}

/* ===== التحقق والإرسال ===== */
const form = $('#leadForm');
let formBusy = false;
const setErr = (el, key) => { el.dataset.key = key; el.textContent = key ? t(key) : ''; };
const normDigits = s => s.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));

function validate() {
  let first = null;
  ['name', 'phone', 'agency'].forEach(id => {
    const inp = $('#' + id);
    const v = normDigits(inp.value.trim());
    let key = '';
    if (!v) key = 'err.required';
    else if (id === 'phone' && !/^\+?\d{9,15}$/.test(v.replace(/[\s.\-()]/g, ''))) key = 'err.phone';
    inp.setAttribute('aria-invalid', key ? 'true' : 'false');
    setErr($('#err-' + id), key);
    if (key && !first) first = inp;
  });
  ['team', 'leads', 'date', 'time'].forEach(n => {
    const picked = $(`input[name="${n}"]:checked`, form);
    setErr($('#err-' + n), picked ? '' : 'err.choose');
    if (!picked && !first) first = $(`input[name="${n}"]`, form);
  });
  return first;
}

function collect() {
  const v = id => $('#' + id).value.trim();
  const radio = n => $(`input[name="${n}"]:checked`, form)?.value || '';
  return {
    name: v('name'),
    phone: normDigits(v('phone')),
    agency: v('agency'),
    city: v('city'),
    team: radio('team'),
    leads: radio('leads'),
    pains: $$('input[name="pains"]:checked', form).map(i => i.value).join(', '),
    date: radio('date'),
    time: radio('time'),
    lang,
    sentAt: new Date().toISOString()
  };
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('#formMsg');
  setErr(msg, '');
  const first = validate();
  if (first) { setErr(msg, 'err.form'); first.focus(); return; }
  if ($('input[name="website"]', form).value) { booked = collect(); showDone(); return; } // honeypot

  const payload = collect();
  const btn = $('#submitBtn');
  formBusy = true; btn.disabled = true; btn.textContent = t('form.sending');
  try {
    if (CONFIG.SHEETS_URL) {
      await fetch(CONFIG.SHEETS_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
    } else {
      console.info('Demo mode (SHEETS_URL empty). Payload:', payload);
      await new Promise(r => setTimeout(r, 700));
    }
    booked = payload;
    showDone();
  } catch (err) {
    setErr(msg, 'err.send');
  } finally {
    formBusy = false; btn.disabled = false; btn.textContent = t('form.submit');
  }
});

function renderDone() {
  const [y, m, d] = booked.date.split('-').map(Number);
  const dateStr = new Intl.DateTimeFormat(locale(), { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(y, m - 1, d, 12));
  $('#doneText').textContent = t('ok.text', { date: dateStr, time: booked.time });
}
function showDone() {
  $('#formWrap').hidden = true;
  $('#done').hidden = false;
  renderDone();
  $('#doneTitle').focus();
}

/* ===== تشغيل ===== */
render();
setLang(new URLSearchParams(location.search).get('lang') === 'fr' ? 'fr' : 'ar');
setPlaying(false);
})();
</script>
</body>
</html>
